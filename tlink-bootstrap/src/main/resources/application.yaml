spring:
  application:
    name: tlink-bootstrap
  datasource:
    url: jdbc:postgresql://localhost:5432/tlink
    driverClassName: org.postgresql.Driver
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.authentication: TRACE